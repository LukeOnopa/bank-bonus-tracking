<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checking Bonus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a precise money tool — calm, exact, no fluff.
   IDEA: a bank ledger / statement that tells you what to do next.
   PICTURE: the working tracker itself; header band of four live totals.
   COLOUR and TYPE: oxford blue band, white panels, magenta for dollars; Red Hat Display + Text.
   LAYOUT: band with totals, tabs, then the live list; stacks to one column under 600px. */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f7,#070f26);--panel:light-dark(#fff,#0f1a3a);--ink:light-dark(#0b1433,#e8ecf7);
--mute:light-dark(#56607a,#9aa5c4);--line:light-dark(#dde2ee,#22305a);--band:#0b1f4b;--mag:#e0115f;
--magsoft:light-dark(#fde7ef,#3a0f24);--ok:light-dark(#0d7a4f,#4fd39a);--oksoft:light-dark(#e3f5ec,#0f3326);
--warn:light-dark(#9a5b00,#f2b84b);--warnsoft:light-dark(#fdf1dc,#3a2a0c);--chip:light-dark(#f1f3f9,#18244a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.fig-n{font-family:"Red Hat Display",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--band);color:#fff;padding:28px 0 0}
h1{font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0 0 4px;font-weight:800;text-wrap:balance}
.sub{color:#b8c3e6;margin:0 0 22px;max-width:70ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#22356e;border-radius:12px 12px 0 0;overflow:hidden}
.stat{background:#102a62;padding:16px 18px}
.stat b{display:block;font:700 clamp(24px,3vw,34px)/1.1 "Red Hat Display",system-ui,sans-serif;white-space:nowrap}
.stat span{color:#b8c3e6;font-size:14px}
.stat.hot b{color:#ff5c96}
.navband{background:var(--band);position:sticky;top:0;z-index:50;box-shadow:0 4px 14px #0b1f4b33}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;background:var(--band)}
nav button{background:none;border:0;color:#c9d2ee;font:600 16px "Red Hat Text",system-ui,sans-serif;padding:10px 16px;border-radius:8px;min-height:44px;cursor:pointer}
nav button[aria-selected=true]{background:#fff;color:var(--band)}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
main{padding:24px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--mute);font-weight:500}
input,select,textarea{font:16px "Red Hat Text",system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:44px;margin-top:4px}
textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;min-height:44px;color:var(--ink);font-size:15px}
.check input{width:20px;min-height:20px;margin:0;accent-color:var(--mag)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.bar input[type=search]{flex:1 1 220px;margin:0}.bar select{flex:0 1 200px;margin:0}
.count{color:var(--mute);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.inel{opacity:.62}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top h3{margin:0;font-size:19px;line-height:1.2}
.top small{display:block;color:var(--mute);font-size:14px}
.amt{font:800 28px/1 "Red Hat Display",system-ui,sans-serif;color:var(--mag);white-space:nowrap}
.req{margin:0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:13px;white-space:nowrap}
.chip.k{background:var(--magsoft)}.chip.g{background:var(--oksoft);color:var(--ok)}.chip.w{background:var(--warnsoft);color:var(--warn)}
.why{font-size:14px;color:var(--warn);margin:0}
.why.ok{color:var(--ok)}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:auto;flex-wrap:wrap}
.foot select{width:auto;flex:1 1 160px;margin:0}
.foot a{color:var(--mute);font-size:14px}
.btn{background:var(--band);color:#fff;border:0;border-radius:8px;font:600 15px "Red Hat Text",system-ui,sans-serif;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
:root[data-theme=dark] .btn,.btn{}
.sec{font-size:22px;margin:26px 0 10px}
.sec:first-child{margin-top:0}
.dates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--mag)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ev{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ev time{font:700 16px "Red Hat Display",system-ui,sans-serif;white-space:nowrap}
.ev .late{color:var(--mag)}
.empty{color:var(--mute);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.note{font-size:14px;color:var(--mute)}
.note a{color:inherit}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--band);color:#fff;padding:8px 8px 8px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;gap:12px;align-items:center;z-index:100;box-shadow:0 8px 24px #0004}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:#fff;color:var(--band);border:0;border-radius:6px;font:600 14px "Red Hat Text",system-ui,sans-serif;padding:8px 12px;min-height:36px;cursor:pointer}
.toast:not(:has(button)){padding:10px 16px}
.card{position:relative}
.card.flying{z-index:60;pointer-events:none;box-shadow:0 18px 40px #0b1f4b55}
.stamp{position:absolute;top:50%;left:50%;font:800 30px/1 "Red Hat Display",system-ui,sans-serif;padding:8px 18px;border:4px solid currentColor;border-radius:10px;background:color-mix(in srgb,var(--panel) 85%,transparent);opacity:0;pointer-events:none;white-space:nowrap;z-index:2}
.st-planned{color:#3b4fd8}.st-applied{color:#0b7fc7}.st-open{color:var(--ok)}.st-earned{color:var(--mag)}.st-closed{color:var(--mute)}.st-denied{color:#d0103a}
.coin{position:fixed;z-index:70;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3,#0000 45%),#f2b84b;border:2px solid #b07a12;color:#7a5208;font:800 14px/22px "Red Hat Display",system-ui,sans-serif;text-align:center;pointer-events:none}
.coin.m{background:radial-gradient(circle at 35% 30%,#fff5,#0000 45%),var(--mag);border-color:#8a0a3a;color:#fff}
.mint{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:12px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.printer{position:absolute;top:-16px;left:6%;width:88%;height:30px;border-radius:9px;background:linear-gradient(#2a3a66,#111b38);box-shadow:0 6px 14px #0006,inset 0 1px 0 #ffffff30;z-index:2}
.printer::after{content:"";position:absolute;bottom:7px;left:7%;right:7%;height:4px;border-radius:2px;background:#000}
.printer i{position:absolute;top:7px;right:12px;width:7px;height:7px;border-radius:50%;background:#4fd39a;box-shadow:0 0 8px #4fd39a}
.printer b{position:absolute;top:4px;left:12px;color:#9fb0dd;font:700 11px "Red Hat Text",system-ui,sans-serif}
.tray{position:absolute;left:0;right:0;top:10px;bottom:0;overflow:hidden;border-radius:0 0 12px 12px}
.bill{position:absolute;left:50%;width:min(78%,240px);height:44px;margin-left:calc(min(78%,240px)/-2);border-radius:4px;background:linear-gradient(135deg,#d6efd9,#9fd3a9 55%,#c4e8ca);border:2px solid #2f6b3d;box-shadow:inset 0 0 0 4px #ffffff55,inset 0 0 0 6px #2f6b3d33,0 3px 6px #0003;color:#1f4d2b;font:800 17px/40px "Red Hat Display",system-ui,sans-serif;display:flex;justify-content:space-between;padding:0 12px}
.bill::before{content:"$";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;border:2px solid #2f6b3d;background:#e8f6ea;text-align:center;font-size:18px;line-height:26px}
.bill.fall{position:fixed;z-index:72;top:0;margin:0;width:130px;left:0;pointer-events:none}
.paid{position:fixed;left:50%;top:42%;z-index:80;width:0;height:0;pointer-events:none}
.paid .rays{position:absolute;left:-230px;top:-230px;width:460px;height:460px;border-radius:50%;background:repeating-conic-gradient(#f2b84b66 0 9deg,#0000 9deg 18deg);-webkit-mask:radial-gradient(#000 25%,#0000 68%);mask:radial-gradient(#000 25%,#0000 68%)}
.paid .big{position:absolute;left:-80px;top:-80px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#f7cf5c 45%,#e0a52a);border:7px solid #a8720e;color:#6e4806;font:800 112px/146px "Red Hat Display",system-ui,sans-serif;text-align:center;box-shadow:0 0 0 14px #f2b84b40,0 24px 60px #0007,inset 0 -8px 0 #0002}
.paid .msg{position:absolute;left:-200px;width:400px;top:96px;text-align:center;color:#fff;font:800 40px/1.05 "Red Hat Display",system-ui,sans-serif;text-shadow:0 3px 0 #0b1f4b,0 10px 30px #000a}
.paid .msg span{display:block;color:#ff4d8d;font-size:52px;margin-top:4px}
.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--mag);color:#fff;font-size:13px;line-height:22px;text-align:center}
.more{border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;font-weight:600;font-size:15px;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.more[open] summary::before{transform:rotate(45deg)}
.more h4{font:700 15px "Red Hat Display",system-ui,sans-serif;margin:12px 0 6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 10px;font-size:14px;margin:6px 0}
.mrow em{font-style:normal;text-align:right;white-space:nowrap;color:var(--mute)}
.mrow .prog{grid-column:1/-1;margin:0;height:6px}
.mrow .prog i.bad{background:var(--warn)}
.why2{margin:4px 0;padding-left:18px;font-size:14px}
.chip.o5{background:var(--oksoft);color:var(--ok);font-weight:600}.chip.o3{background:var(--warnsoft);color:var(--warn);font-weight:600}.chip.o1{background:var(--magsoft);color:var(--mag);font-weight:600}
.chexrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:10px;align-items:end}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
@media(max-width:700px){.chexrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}nav button{flex:none}
.tbl{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td.n{text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:13px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dates{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.ev{grid-template-columns:minmax(0,1fr)}.ev{gap:2px}}
</style>
</head>

 if(!x){let p=c12<=5?75:c12<=12?60:45;if(c1>=3)p-=10;why.push("No ChexSystems reports for this bank yet — estimate uses your 12-month count only.");return{p,why}}

  else if(r==="ok"&&u<=n){plus+=8;why.push(`A reader was approved with ${w} — you're at or under that (about ${u}).`)}

function noise(ac,len){const b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;return s}
function env(ac,node,t,a,peak,dec,dest){const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);node.connect(g);g.connect(dest);return g}
function paySound(ac,bills,gap,printDur){const t0=ac.currentTime+.05,out=ac.createGain();out.gain.value=.7;out.connect(ac.destination);
 // printer motor: buzzy hum with a flutter, under paper "ticks" as each bill feeds out
 const m=ac.createOscillator();m.type="sawtooth";m.frequency.setValueAtTime(70,t0);m.frequency.linearRampToValueAtTime(95,t0+printDur);
 const mf=ac.createBiquadFilter();mf.type="lowpass";mf.frequency.value=600;m.connect(mf);
 const mg=ac.createGain();mg.gain.setValueAtTime(0.0001,t0);mg.gain.exponentialRampToValueAtTime(.12,t0+.08);mg.gain.setValueAtTime(.12,t0+printDur-.08);mg.gain.exponentialRampToValueAtTime(0.0001,t0+printDur);
 const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=22;lg.gain.value=.05;lfo.connect(lg);lg.connect(mg.gain);
 mf.connect(mg);mg.connect(out);m.start(t0);m.stop(t0+printDur+.05);lfo.start(t0);lfo.stop(t0+printDur+.05);
 for(let i=0;i<bills;i++){const t=t0+.22+i*gap,n=noise(ac,.07),f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=2400+Math.random()*900;f.Q.value=1.2;n.connect(f);env(ac,f,t,.004,.35,.06,out);n.start(t);n.stop(t+.08)}
 // "cha": register drawer slam
 const tc=t0+printDur+.02,n=noise(ac,.25),lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1800;n.connect(lp);env(ac,lp,tc,.003,.9,.16,out);n.start(tc);n.stop(tc+.25);
 const k=ac.createOscillator();k.type="triangle";k.frequency.setValueAtTime(180,tc);k.frequency.exponentialRampToValueAtTime(55,tc+.12);env(ac,k,tc,.003,.6,.14,out);k.start(tc);k.stop(tc+.2);
 const r=noise(ac,.18),hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=5000;r.connect(hp);env(ac,hp,tc+.03,.01,.18,.14,out);r.start(tc+.03);r.stop(tc+.22);
 // "ching": two bright bell strikes with inharmonic partials
 [[tc+.11,1760,.5],[tc+.2,2349,.42]].forEach(([t,f,p])=>[[1,1],[2.01,.5],[2.76,.32],[5.4,.16],[8.1,.07]].forEach(([mul,gm])=>{const o=ac.createOscillator();o.type="sine";o.frequency.value=f*mul;env(ac,o,t,.002,p*gm,1.6/mul**.5,out);o.start(t);o.stop(t+1.8)}));
 return tc}
function burstAt(cx,cy,n){const P=[];for(let i=0;i<n;i++){const e=document.createElement("div");e.className="coin"+(i%4?"":" m");e.textContent="$";e.style.left=cx+"px";e.style.top=cy+"px";document.body.appendChild(e);
 const a=Math.random()*Math.PI*2,d=120+Math.random()*220,x=Math.cos(a)*d,y=Math.sin(a)*d-90,sp=(Math.random()*900-450)|0;
 P.push(wait(e.animate([{transform:"scale(.2)",opacity:1},{transform:`translate(${x}px,${y}px) rotate(${sp/2}deg) scale(1.1)`,opacity:1,offset:.4},{transform:`translate(${x*1.2}px,${y+300}px) rotate(${sp}deg) scale(.8)`,opacity:0}],{duration:1300+Math.random()*400,easing:"cubic-bezier(.2,.7,.4,1)",fill:"forwards"})).then(()=>e.remove()))}return Promise.all(P)}
function rain(n){const P=[],W=innerWidth,H=innerHeight;for(let i=0;i<n;i++){const b=document.createElement("div");b.className="bill fall";b.innerHTML="<span>100</span><span>100</span>";document.body.appendChild(b);
 const x=Math.random()*(W-130),r0=Math.random()*60-30,r1=r0+(Math.random()*240-120),sw=Math.random()*120-60,delay=Math.random()*500;
 P.push(wait(b.animate([{transform:`translate(${x}px,-80px) rotate(${r0}deg) rotateX(0deg)`,opacity:1},{transform:`translate(${x+sw}px,${H*.5}px) rotate(${(r0+r1)/2}deg) rotateX(180deg)`,offset:.5},{transform:`translate(${x-sw}px,${H+80}px) rotate(${r1}deg) rotateX(360deg)`,opacity:1}],{duration:1600+Math.random()*900,delay,easing:"cubic-bezier(.35,.1,.6,1)",fill:"both"})).then(()=>b.remove()))}return Promise.all(P)}
async function payday(card,o,fly=true){
 const BILLS=7,GAP=.12,PRINT=.22+BILLS*GAP+.2,ac=audio();if(ac)paySound(ac,BILLS,GAP,PRINT);
 const mint=document.createElement("div");mint.className="mint";
 mint.innerHTML=`<div class="tray"></div><div class="printer"><b>MINT</b><i></i></div>`;card.appendChild(mint);
 const tray=mint.firstChild,pr=mint.lastChild,A=(el,k,op)=>wait(el.animate(k,op));
 await A(pr,[{transform:"translateY(-40px)",opacity:0},{transform:"translateY(0)",opacity:1}],{duration:200,easing:"cubic-bezier(.3,1.5,.5,1)",fill:"forwards"});
 const shake=pr.animate([0,-2,2,-1,1,0].map(y=>({transform:`translate(${y}px,${-y}px)`})),{duration:120,iterations:Math.ceil((PRINT-.2)/.12)});
 const H=tray.clientHeight,feeds=[];
 for(let i=0;i<BILLS;i++){const b=document.createElement("div");b.className="bill";b.innerHTML="<span>100</span><span>100</span>";tray.appendChild(b);
  const y=H-52-i*7,rot=(Math.random()*8-4).toFixed(1);
  feeds.push(A(b,[{transform:"translateY(-50px)"},{transform:"translateY(14px)",offset:.35},{transform:`translateY(${y}px) rotate(${rot}deg)`}],{duration:430,delay:(.22+i*GAP)*1000-200,easing:"cubic-bezier(.4,0,.3,1.3)",fill:"both"}))}
 await Promise.all(feeds);shake.cancel();
 // cha-ching!
 const pd=document.createElement("div");pd.className="paid";pd.innerHTML=`<div class="rays"></div><div class="big">$</div><div class="msg">You got paid!<span>+${money(S.track[o.id]?.got??o.amt)}</span></div>`;document.body.appendChild(pd);
 const [rays,big,msg]=pd.children;
 rays.animate([{transform:"rotate(0) scale(.3)",opacity:0},{transform:"rotate(40deg) scale(1)",opacity:1,offset:.15},{transform:"rotate(160deg) scale(1.1)",opacity:1,offset:.85},{transform:"rotate(190deg) scale(1.2)",opacity:0}],{duration:1900,fill:"forwards"});
 big.animate([{transform:"scale(0) rotate(-30deg)"},{transform:"scale(1.25) rotate(8deg)",offset:.12},{transform:"scale(.95) rotate(-3deg)",offset:.2},{transform:"scale(1) rotate(0)",offset:.28},{transform:"scale(1) rotateY(720deg)",offset:.75},{transform:"scale(0)",opacity:0}],{duration:1900,easing:"ease-out",fill:"forwards"});
 msg.animate([{transform:"translateY(30px) scale(.6)",opacity:0},{transform:"translateY(0) scale(1.08)",opacity:1,offset:.18},{transform:"scale(1)",opacity:1,offset:.3},{transform:"scale(1)",opacity:1,offset:.82},{transform:"translateY(-20px)",opacity:0}],{duration:1900,fill:"forwards"});
 const c=pd.getBoundingClientRect(),fx=[burstAt(c.left,c.top,28),rain(16)];
 A(card,[0,-6,6,-4,4,0].map(x=>({transform:`translateX(${x}px)`})),{duration:300});
 await new Promise(r=>setTimeout(r,1100));
 if(fly)await flyTo(card,{dur:650,lift:60});else await A(mint,[{opacity:1},{opacity:0,transform:"translateY(20px)"}],{duration:450,fill:"forwards"});
 await Promise.race([Promise.all(fx),new Promise(r=>setTimeout(r,1500))]);pd.remove()}
async function exitCard(card,v,o){card.classList.add("flying");card.querySelectorAll("select").forEach(s=>s.disabled=true);
 if(RM.matches){await wait(card.animate([{opacity:1},{opacity:0}],{duration:200,fill:"forwards"}));return}
 const A=(k,o)=>wait(card.animate(k,o));
 if(v==="planned"){await stampIn(card,v,-8);await A([{transform:"none"},{transform:"translateY(-6px)"}],{duration:160,fill:"forwards"});await flyTo(card,{lift:40})}
 else if(v==="applied"){ // paper plane: tilt back, then launch up and over in an arc
  await stampIn(card,v,-6);await A([{transform:"none"},{transform:"translate(-14px,14px) rotate(4deg) scale(.96)"}],{duration:220,easing:"ease-out",fill:"forwards"});
  await flyTo(card,{rot:-38,lift:160,dur:760})}
 else if(v==="open"){ // green glow pulse, then zoom in
  stampIn(card,v,-4);await A([{boxShadow:"0 0 0 0 #0d7a4f00"},{boxShadow:"0 0 0 10px #4fd39a88",transform:"scale(1.04)"},{boxShadow:"0 0 0 18px #4fd39a00",transform:"scale(1)"}],{duration:520,fill:"forwards"});await flyTo(card)}
 else if(v==="earned")await payday(card,o)
 else if(v==="closed"){ // the account folds shut like a ledger, then slides away
  await stampIn(card,v,0);card.style.transformOrigin="top";await A([{transform:"none"},{transform:"perspective(800px) rotateX(70deg) scaleY(.6)",opacity:.8,offset:.6},{transform:"perspective(800px) rotateX(90deg) scaleY(.05)",opacity:.6}],{duration:520,easing:"ease-in",fill:"forwards"});
  await A([{transform:"scaleY(.05)",opacity:.6},{transform:"translateX(60px) scaleY(.05)",opacity:0}],{duration:260,fill:"forwards"})}
 else if(v==="denied"){ // red stamp, head-shake, then it drops off the page
  await stampIn(card,v,-14);await A([0,-12,12,-9,9,-5,5,0].map(x=>({transform:`translateX(${x}px)`})),{duration:460,fill:"forwards"});
  await A([{transform:"none",opacity:1},{transform:"translateY(40px) rotate(6deg)",opacity:.9,offset:.3},{transform:"translateY(520px) rotate(22deg)",opacity:0}],{duration:700,easing:"cubic-bezier(.5,0,.9,.4)",fill:"forwards"})}}
function pulseTab(){const b=document.querySelector('#tabs [data-tab="mine"]');if(b&&!RM.matches)b.animate([{transform:"scale(1)"},{transform:"scale(1.14)"},{transform:"scale(1)"}],{duration:380,easing:"cubic-bezier(.3,1.6,.5,1)"})}
async function setStatus(id,v,el){const t=T(id),o=all().find(x=>x.id===id),was=t.status;t.status=v;t.u=now();const d=today();
 if(v==="applied"&&!t.applied)t.applied=d;if(v==="open"&&!t.opened)t.opened=d;
 if(v==="earned"&&!t.bonusDate){t.bonusDate=d;t.got=o.amt}if(v==="closed"&&!t.closed)t.closed=d;
 if(!v)S.track[id]={u:now()};save();
 const card=el&&el.closest("[data-card]");
 if(tab==="find"&&v&&!was&&card){busy++;try{await exitCard(card,v,o)}finally{busy--}render();pulseTab();toast(`${o.b} moved to My accounts`,"mine");return}
 if(v==="earned"&&was!=="earned"&&card&&!RM.matches){busy++;card.classList.add("flying");try{await payday(card,o,false)}finally{busy--;card.classList.remove("flying")}}
 render();toast(v?"Marked "+STATUS.find(s=>s[0]===v)[1].toLowerCase():"Moved back to Find offers",v?"":"find")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-act]");if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;askReset=false;$("#toast").classList.remove("on");render();scrollTo({top:0,behavior:RM.matches?"auto":"smooth"});try{history.replaceState(null,"","#"+tab)}catch(x){}return}
 const a=b.dataset.act;
 if(a==="rvapply"&&RV){S.profile.chexInq=RV.inq.map(({name,date,vis,inc})=>({name,date,vis,inc}));S.profile.chex=countsFrom(S.profile.chexInq);S.profile.chexAuto=true;S.profile.u=now();RV=null;CHMSG="Counts updated from your report.";save();render();toast("ChexSystems counts updated")}
 if(a==="rvcancel"){RV=null;CHMSG="";render()}
 if(a==="chexpaste"){const t=$("#chexpaste")?.value||"";if(t.trim()){finishRead(parseReport(t),"pasted text");render()}}
 if(a==="chexfill"){S.profile.chexAuto=false;S.profile.chex=fillChex();S.profile.u=now();save();render();toast("Estimated from accounts in your tracker — adjust to match your report")}
 if(a==="reset-ask"||a==="reset-no"){askReset=a==="reset-ask";render();if(askReset)$('[data-act="reset-no"]')?.focus()}
 if(a==="reset-do"){const u=now();undoSnap=JSON.parse(JSON.stringify(S.track));let n=0;
  for(const id in S.track){if(S.track[id].status)n++;S.track[id]={u}}askReset=false;save();render();toast(`Reset ${n} account${n===1?"":"s"} — back in Find offers`,"find",1)}
 if(a==="undo"&&undoSnap){const u=now();for(const id in undoSnap)undoSnap[id].u=u;S.track=undoSnap;undoSnap=null;save();render();toast("Restored your accounts")}
 if(a==="del"){S.custom=S.custom.filter(c=>c.id!==b.dataset.id);S.gone=[...(S.gone||[]),b.dataset.id];S.track[b.dataset.id]={u:now()};save();render()}
 if(a==="copy"){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Backup copied"),()=>toast("Copy blocked — select the restore box text instead"))}
 if(a==="imp"){try{const n=JSON.parse($("#imp").value);if(!n.profile||!n.track)throw 0;const u=now();n.profile.u=u;for(const k in n.track)n.track[k].u=u;S={...S,...n};save();render();toast("Restored")}catch(x){toast("That doesn't look like a backup")}}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset.act==="f"&&el.dataset.k==="q"){F.q=el.value;render()}});
document.addEventListener("change",e=>{const el=e.target,a=el.dataset.act;if(!a)return;
 if(a==="status")return setStatus(el.dataset.id,el.value,el);
 if(a==="prof"){const k=el.dataset.k;S.profile[k]=el.type==="checkbox"?el.checked:el.type==="number"?+el.value:el.value;S.profile.u=now();save();setTimeout(render,0)}
 if(a==="chexfile"){const f=el.files&&el.files[0];el.value="";if(f)readFile(f);return}
 if(a==="rvinc"&&RV){RV.inq[+el.dataset.i].inc=el.checked;setTimeout(render,0);return}
 if(a==="chex"){S.profile.chexAuto=false;S.profile.chex={...(S.profile.chex||{}),[el.dataset.k]:el.value===""?null:Math.max(0,+el.value)};S.profile.u=now();save();setTimeout(render,0)}
 if(a==="f"&&el.dataset.k!=="q"){F[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;render()}
 if(a==="t"){const t=T(el.dataset.id);t[el.dataset.k]=el.type==="number"?+el.value:el.value;t.u=now();save();if(el.tagName!=="TEXTAREA")render()}});
document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest(".chexdrop")){e.preventDefault();e.target.closest(".chexdrop").style.borderColor="var(--mag)"}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest(".chexdrop");if(z)z.style.borderColor=""});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest(".chexdrop");if(!z)return;e.preventDefault();z.style.borderColor="";const f=e.dataTransfer.files[0];if(f)readFile(f)});
function refreshChex(){if(S.profile.chexAuto&&Array.isArray(S.profile.chexInq))S.profile.chex=countsFrom(S.profile.chexInq)}
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.det)d.open?OPEN.add(d.dataset.det):OPEN.delete(d.dataset.det)},true);
document.addEventListener("submit",e=>{if(e.target.id!=="add")return;e.preventDefault();const f=new FormData(e.target),n=k=>f.get(k)===""?null:+f.get(k);
 const st=String(f.get("st")||"").toUpperCase().split(/[^A-Z]+/).filter(s=>STATES.includes(s));
 const url=String(f.get("url")||"");
 S.custom.push({id:"c"+Date.now(),b:String(f.get("b")),a:String(f.get("a")||"Checking"),t:"bank",amt:n("amt")||0,dd:n("dd")||0,win:n("win")||90,tx:n("tx")||0,keep:n("keep"),cd:n("cd"),st:st.length?st:"ALL",pull:"?",fee:"—",req:String(f.get("req")||""),url:/^https:\/\//.test(url)?url:""});
 save();render();toast("Offer added")});
try{const s=JSON.parse(localStorage.getItem("cbt")||"null");if(s&&s.profile)S={...S,...s}}catch(e){}
refreshChex();
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/6e4);return m<2?"just now":m<60?m+" minutes ago":m<1440?Math.round(m/60)+" hours ago":Math.round(m/1440)+" days ago"}
function freshLine(){const e=$("#fresh");if(!e)return;if(!META){e.textContent="Showing the built-in offer list (researched Nov 26, 2026).";return}
 const ok=META.sources.filter(s=>s.ok).map(s=>s.name),bad=META.sources.filter(s=>!s.ok);
 e.textContent=`Offers checked ${ago(META.generated)}`+(ok.length?` · from ${ok.join(" and ")}`:"")+(bad.length?` · couldn't read ${bad.map(s=>s.name).join(", ")} this time${bad.some(s=>s.lastOk)?" (using its last good data)":""}`:"")}
(async()=>{try{const r=await fetch("data/offers.json",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
 if(!Array.isArray(j.offers)||j.offers.length<10)throw 0;const NUM=["amt","dd","mindd","mdd","dep","win","tx","keep","cd","spend","prevAmt"];
 const clean=o=>{const x={...o};for(const k of NUM)x[k]=x[k]==null||x[k]===""||!isFinite(+x[k])?(k==="keep"||k==="cd"?null:undefined):+x[k];
  x.st=Array.isArray(x.st)?x.st.filter(s=>STATES.includes(s)):x.st==="ALL"?"ALL":"?";if(Array.isArray(x.st)&&!x.st.length)x.st="?";
  for(const k of ["id","b","a","req","note","fee","pull","url","offerUrl","exp","seen","first","changed","t"])if(x[k]!=null)x[k]=String(x[k]);return x};
 const L=j.offers.filter(o=>o&&o.id&&o.b&&+o.amt>0).map(clean);if(L.length<10)throw 0;OFFERS.length=0;OFFERS.push(...L);META=j;
 FIRST_RUN=j.offers.reduce((m,o)=>o.first&&(!m||o.first<m)?o.first:m,"");}catch(e){META=null}
 freshLine();render()})();
setInterval(freshLine,60000);
const h=(location.hash||"").slice(1);if(["find","mine","cal","guide","data"].includes(h))tab=h;
render();
(async()=>{try{if(!window.claude||!claude.use)return;const timer=new Promise(r=>setTimeout(()=>r(null),10000));
 db=await Promise.race([claude.use("db"),timer]);const user=await Promise.race([claude.use("user"),timer]);if(!db||!user)return;
 const uid=await user.id();if(!uid)return;ref=db.collection("data/users/"+uid).doc("state");
 const r=await Promise.race([ref.get(),timer]);const d=r&&(typeof r.data==="function"?r.data():(r.data??r));
 if(d&&d.profile&&d.track)S=merge(S,d);refreshChex();save();render()}catch(e){ref=null}})();
}
