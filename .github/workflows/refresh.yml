name: Refresh bonus offers

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may run it a few minutes late)
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # only used by the monthly keep-alive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3
      - name: Test the scraper
        run: python tests/test_scrape.py
      - name: Test the location lookup
        run: python tests/test_locate.py
      - name: Test the roundup reference
        run: python tests/test_reference.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: Scrape offers and build the site
        run: python scripts/scrape.py
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Find bonuses on banks' own websites (crawler; never blocks publishing)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python tests/test_discover.py
          python scripts/discover.py --prev "${PAGES_URL%/}/data/discovered.json" --offers site/data/offers.json \
            --add-to site/data/offers.json --out site/data/discovered.json --minutes 4
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Keep the last crawl if this one didn't finish
        if: always()
        run: |
          [ -s site/data/discovered.json ] || curl -sf "${PAGES_URL%/}/data/discovered.json" -o site/data/discovered.json || true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Monthly keep-alive (GitHub pauses scheduled jobs after 60 days with no commits)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            date -u > data/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/keepalive.txt
            git commit -m "Monthly keep-alive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
